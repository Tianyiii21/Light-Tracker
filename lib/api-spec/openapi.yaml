openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: poetry
    description: AI-generated poetic text for the journaling app
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /poetry/generate:
    post:
      operationId: generatePoetry
      tags: [poetry]
      summary: Generate a short AI poetic line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoetryRequest"
      responses:
        "200":
          description: Generated poetic line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoetryResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PoetryRequest:
      type: object
      properties:
        type:
          type: string
          enum: [morning_quote, gratitude_header, closing_line]
      required:
        - type
    PoetryResult:
      type: object
      properties:
        text:
          type: string
      required:
        - text
